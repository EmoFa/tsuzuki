version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - misspell
    - unconvert
    - usestdlibvars
  settings:
    errcheck:
      exclude-functions:
        # Best-effort cleanup and output where failure changes nothing.
        - (io.Closer).Close
        - (net.Conn).Close
        - (net.Conn).SetDeadline
        - (net.Conn).SetWriteDeadline
        - (*os.File).Close
        - (*os.Process).Kill
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - os.Remove
        - os.RemoveAll
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - io.WriteString
        - io.Copy
        - (*text/tabwriter.Writer).Flush
        - (*os/exec.Cmd).Wait # exit status is read elsewhere or irrelevant
        - (*net/http.Server).Serve # returns when shut down
        - (net/http.ResponseWriter).Write # the client went away
        # On-screen messages are cosmetic.
        - (*github.com/EmoFa/tsuzuki/internal/player.Playback).ShowText
        - (github.com/EmoFa/tsuzuki/internal/session.Playback).ShowText
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [errcheck, bodyclose]

formatters:
  enable:
    - gofmt
