# Publishes tsuzuki to the package repositories that aren't handled by
# goreleaser: the apt repository on GitHub Pages, and Fedora's Copr.
name: Packages

on:
  # A release published by the Release workflow uses the Actions token, and
  # GitHub won't start a workflow from an event that token created — so this
  # follows the workflow itself rather than the release it publishes.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build everything with a throwaway key, publishing nothing"
        type: boolean
        default: true

concurrency:
  group: packages
  cancel-in-progress: false

env:
  # How many releases the apt pool keeps, newest first.
  KEEP_RELEASES: 5

jobs:
  apt:
    name: apt repository
    # A failed release has nothing worth publishing.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Collect the packages of recent releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p debs
          gh release list --limit "$KEEP_RELEASES" --exclude-drafts --exclude-pre-releases \
            --json tagName --jq '.[].tagName' > tags
          while read -r tag; do
            gh release download "$tag" --pattern '*.deb' --dir debs --clobber || true
          done < tags
          ls -l debs

      - name: Import the signing key
        id: key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            # Nothing is published, so a throwaway key proves the build alone.
            gpg --batch --passphrase '' --quick-gen-key 'tsuzuki dry run <dry@run.invalid>' rsa3072 sign never
          else
            case "$APT_GPG_PRIVATE_KEY" in
              *"BEGIN PGP PRIVATE KEY BLOCK"*) ;;
              *) echo "::error::APT_GPG_PRIVATE_KEY isn't an armoured private key: re-export it with \`gpg --armor --export-secret-keys <fingerprint>\`"; exit 1 ;;
            esac
            printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          fi
          echo "id=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')" >> "$GITHUB_OUTPUT"

      - name: Build the repository
        env:
          APT_GPG_KEY_ID: ${{ steps.key.outputs.id }}
          APT_SITE_URL: https://emofa.github.io/tsuzuki
        run: packaging/build-apt-repo.sh debs site

      - name: Check it installs
        run: packaging/test-apt-repo.sh site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        if: inputs.dry_run != true
        uses: actions/deploy-pages@v4

  copr:
    name: Fedora Copr
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    container: fedora:43
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          # The tag being released, so the spec matches what it packages.
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Install the build tools
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            rpm-build rpmdevtools copr-cli curl jq golang git-core tar

      - name: Work out the version
        id: version
        run: |
          version="${{ github.event.workflow_run.head_branch }}"
          if [ -z "$version" ]; then
            # A manual run packages whatever the latest release is.
            version=$(curl -fsSL https://api.github.com/repos/EmoFa/tsuzuki/releases/latest | jq -r .tag_name)
          fi
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Build the source RPM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          rpmdev-setuptree
          sources=~/rpmbuild/SOURCES
          # Copr rebuilds the spec from the source RPM, where a --define from
          # here wouldn't reach it.
          sed -i "s/^%global tsuzuki_version .*/%global tsuzuki_version $VERSION/" packaging/tsuzuki.spec
          grep -q "^%global tsuzuki_version $VERSION$" packaging/tsuzuki.spec
          # The release's own tarballs, so what Copr builds is what the spec
          # names. spectool reports success even when a source is missing, so
          # what matters is whether the files are there afterwards; a dry run
          # before the first release with a vendor tarball makes them here.
          spectool -g -R packaging/tsuzuki.spec || true
          git config --global --add safe.directory "$PWD"
          if [ ! -s "$sources/tsuzuki-$VERSION.tar.gz" ]; then
            echo "::notice::building the source tarball from this checkout"
            git archive --prefix="tsuzuki-$VERSION/" -o "$sources/tsuzuki-$VERSION.tar.gz" HEAD
          fi
          if [ ! -s "$sources/tsuzuki-$VERSION-vendor.tar.gz" ]; then
            echo "::notice::building the vendor tarball from this checkout"
            go mod vendor
            tar czf "$sources/tsuzuki-$VERSION-vendor.tar.gz" vendor
            rm -rf vendor
          fi
          rpmbuild -bs packaging/tsuzuki.spec
          find ~/rpmbuild/SRPMS -name '*.src.rpm'

      - name: Send it to Copr
        if: inputs.dry_run != true
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_USERNAME: ${{ secrets.COPR_USERNAME }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
        run: |
          mkdir -p ~/.config
          cat > ~/.config/copr <<-CONFIG
          [copr-cli]
          login = $COPR_LOGIN
          username = $COPR_USERNAME
          token = $COPR_TOKEN
          copr_url = https://copr.fedorainfracloud.org
          CONFIG
          copr-cli build emofa/tsuzuki ~/rpmbuild/SRPMS/tsuzuki-${{ steps.version.outputs.version }}-*.src.rpm
