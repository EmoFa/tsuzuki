name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Classic token with public_repo: pushes to EmoFa/homebrew-tap and
          # EmoFa/winget-pkgs, and opens the winget pull request.
          PACKAGES_GITHUB_TOKEN: ${{ secrets.PACKAGES_GITHUB_TOKEN }}
          # SSH private key registered with the AUR account that owns tsuzuki-bin.
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
