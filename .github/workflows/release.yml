name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release to build the Windows installer for, e.g. v0.4.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Vendor the dependencies for the Fedora package
        # Copr builds without network access, so the release carries the
        # dependencies with it. Removed again so goreleaser builds as usual.
        run: |
          go mod vendor
          tar czf vendor.tar.gz vendor
          rm -rf vendor
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Classic token with public_repo: pushes to EmoFa/homebrew-tap and
          # EmoFa/winget-pkgs, and opens the winget pull request.
          PACKAGES_GITHUB_TOKEN: ${{ secrets.PACKAGES_GITHUB_TOKEN }}
          # SSH private key registered with the AUR account that owns tsuzuki-bin.
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}

  installer:
    name: Windows installer
    needs: [release]
    # Runs after a release, and on its own against an existing one.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Work out which release to build
        id: rel
        run: |
          $tag = "${{ inputs.version }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag -replace '^v', '')" >> $env:GITHUB_OUTPUT

      - name: Take the binaries from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = "${{ steps.rel.outputs.version }}"
          gh release download ${{ steps.rel.outputs.tag }} --dir zips `
            --pattern "*windows_amd64.zip" --pattern "*windows_arm64.zip"
          Expand-Archive "zips\tsuzuki_${v}_windows_amd64.zip" -DestinationPath packaging\windows\amd64
          Expand-Archive "zips\tsuzuki_${v}_windows_arm64.zip" -DestinationPath packaging\windows\arm64
          Copy-Item LICENSE packaging\windows\LICENSE.txt

      - name: Build the installer
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          # arm64 support arrived in Inno Setup 6.3.
          & $iscc /? | Select-Object -First 1
          & $iscc /DVersion=${{ steps.rel.outputs.version }} packaging\windows\tsuzuki.iss

      - name: Install it, run it, and uninstall it
        run: |
          $exe = "packaging\windows\Output\tsuzuki_${{ steps.rel.outputs.version }}_windows_setup.exe"
          $dir = "$env:RUNNER_TEMP\tsuzuki-install-test"
          Start-Process -FilePath $exe -Wait -ArgumentList `
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=addtopath", "/DIR=$dir"

          & "$dir\tsuzuki.exe" version
          if ($LASTEXITCODE -ne 0) { throw "the installed tsuzuki didn't run" }
          if (-not ([Environment]::GetEnvironmentVariable('Path', 'User') -like "*$dir*")) {
            throw "the installer didn't add itself to PATH"
          }

          Start-Process -FilePath "$dir\unins000.exe" -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES"
          if (Test-Path "$dir\tsuzuki.exe") { throw "uninstalling left the binary behind" }
          if ([Environment]::GetEnvironmentVariable('Path', 'User') -like "*$dir*") {
            throw "uninstalling left the PATH entry behind"
          }
          Write-Host "installed, ran, and uninstalled cleanly"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: packaging/windows/Output/*.exe
          if-no-files-found: error

  # The x64 runner can't tell whether the arm64 half of the installer works, so
  # a Windows on Arm runner installs it there too. Nothing reaches the release
  # until both have.
  installer-arm64:
    name: Windows installer (arm64)
    needs: [installer]
    # always(), because a manual run skips the release job and GitHub carries a
    # skip down the whole chain otherwise.
    if: always() && needs.installer.result == 'success'
    runs-on: windows-11-arm
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer

      - name: Install it, check it's the arm64 build, and uninstall it
        run: |
          $exe = (Get-ChildItem *.exe)[0].FullName
          $dir = "$env:RUNNER_TEMP\tsuzuki-arm64-test"
          Start-Process -FilePath $exe -Wait -ArgumentList `
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=addtopath", "/DIR=$dir"

          & "$dir\tsuzuki.exe" version
          if ($LASTEXITCODE -ne 0) { throw "the installed tsuzuki didn't run" }

          # An x64 binary would run here under emulation and look fine, so read
          # the machine type out of the PE header: 0xAA64 is arm64.
          $stream = [IO.File]::OpenRead("$dir\tsuzuki.exe")
          $reader = New-Object IO.BinaryReader($stream)
          $stream.Position = 0x3C
          $stream.Position = $reader.ReadInt32() + 4
          $machine = $reader.ReadUInt16()
          $reader.Close()
          Write-Host ("machine type: 0x{0:X4}" -f $machine)
          if ($machine -ne 0xAA64) { throw "the installer put an x64 binary on an arm64 machine" }

          Start-Process -FilePath "$dir\unins000.exe" -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES"
          if (Test-Path "$dir\tsuzuki.exe") { throw "uninstalling left the binary behind" }
          Write-Host "arm64 installed, ran, and uninstalled cleanly"

  installer-publish:
    name: Publish the installer
    needs: [installer, installer-arm64]
    if: always() && needs.installer.result == 'success' && needs['installer-arm64'].result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.version }}"
          [ -n "$tag" ] || tag="${{ github.ref_name }}"
          ls -l ./*.exe
          gh release upload "$tag" ./*.exe --clobber
