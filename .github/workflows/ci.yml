name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.2
      - name: golangci-lint (windows, darwin)
        run: |
          for os in windows darwin; do
            GOOS=$os golangci-lint run ./...
          done
      - name: config docs are complete
        run: go test ./internal/config -run TestDocs

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Tests needing mpv or Chromium skip themselves when those aren't installed.
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build -trimpath ./cmd/tsuzuki

  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 30.0.16248370
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # gomobile needs a newer Go than tsuzuki; android/bind says which.
          go-version-file: android/bind/go.mod
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install the Android platform and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Lint the Go core for Android
        run: GOOS=android GOARCH=arm64 go vet ./mobile/...
      - name: Build the app
        run: make android

  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=before
        env:
          # Snapshots never publish; the package steps only need the variables set.
          PACKAGES_GITHUB_TOKEN: unused
          AUR_SSH_KEY: unused
